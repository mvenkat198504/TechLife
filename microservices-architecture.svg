<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#8b949e"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1400" height="950" fill="#0d1117"/>
  
  <!-- Title -->
  <text x="700" y="30" fill="#ffffff" font-size="24" font-weight="bold" text-anchor="middle">Highly Scalable Microservices Architecture</text>
  <text x="700" y="55" fill="#8b949e" font-size="12" text-anchor="middle">API Gateway • Service Boundaries • Database-per-Service • Messaging • Caching • Resiliency • Security • Observability</text>

  <!-- ============ CLIENT LAYER ============ -->
  <rect x="50" y="90" width="120" height="50" rx="6" fill="#1f6feb"/>
  <text x="110" y="120" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">Web/Mobile</text>
  <text x="110" y="135" fill="#fff" font-size="10" text-anchor="middle">Clients</text>

  <!-- ============ API GATEWAY ============ -->
  <rect x="250" y="70" width="200" height="90" rx="8" fill="#238636" stroke="#7ee787" stroke-width="2"/>
  <text x="350" y="95" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">API Gateway</text>
  <text x="350" y="115" fill="#d0f0d0" font-size="9" text-anchor="middle">• Rate Limiting</text>
  <text x="350" y="128" fill="#d0f0d0" font-size="9" text-anchor="middle">• Auth & Validation</text>
  <text x="350" y="141" fill="#d0f0d0" font-size="9" text-anchor="middle">• Routing & Load Balancing</text>
  
  <!-- Client to Gateway -->
  <line x1="170" y1="115" x2="250" y2="115" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- ============ SERVICE DISCOVERY ============ -->
  <rect x="550" y="70" width="140" height="90" rx="8" fill="#d29922" stroke="#f0883e" stroke-width="2"/>
  <text x="620" y="95" fill="#332" font-size="12" font-weight="bold" text-anchor="middle">Service Discovery</text>
  <text x="620" y="112" fill="#332" font-size="9" text-anchor="middle">&amp; Registry</text>
  <text x="620" y="127" fill="#332" font-size="9" text-anchor="middle">(Consul/Eureka)</text>
  <text x="620" y="142" fill="#332" font-size="9" text-anchor="middle">Health checks</text>
  
  <!-- Gateway to Discovery -->
  <line x1="450" y1="115" x2="550" y2="115" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- ============ MICROSERVICES ============ -->
  <!-- Service 1: User Service -->
  <rect x="50" y="220" width="140" height="100" rx="8" fill="#1f6feb" stroke="#58a6ff" stroke-width="2"/>
  <text x="120" y="245" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">User Service</text>
  <text x="120" y="262" fill="#58a6ff" font-size="9" text-anchor="middle">Authentication</text>
  <text x="120" y="277" fill="#58a6ff" font-size="9" text-anchor="middle">Profile Management</text>
  <text x="120" y="292" fill="#58a6ff" font-size="9" text-anchor="middle">Authorization</text>
  <text x="120" y="307" fill="#58a6ff" font-size="9" text-anchor="middle">Roles &amp; Permissions</text>

  <!-- Service 2: Product Service -->
  <rect x="250" y="220" width="140" height="100" rx="8" fill="#1f6feb" stroke="#58a6ff" stroke-width="2"/>
  <text x="320" y="245" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Product Service</text>
  <text x="320" y="262" fill="#58a6ff" font-size="9" text-anchor="middle">Catalog Management</text>
  <text x="320" y="277" fill="#58a6ff" font-size="9" text-anchor="middle">Search &amp; Filtering</text>
  <text x="320" y="292" fill="#58a6ff" font-size="9" text-anchor="middle">Pricing</text>
  <text x="320" y="307" fill="#58a6ff" font-size="9" text-anchor="middle">Inventory</text>

  <!-- Service 3: Order Service -->
  <rect x="450" y="220" width="140" height="100" rx="8" fill="#1f6feb" stroke="#58a6ff" stroke-width="2"/>
  <text x="520" y="245" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Order Service</text>
  <text x="520" y="262" fill="#58a6ff" font-size="9" text-anchor="middle">Order Processing</text>
  <text x="520" y="277" fill="#58a6ff" font-size="9" text-anchor="middle">Payment Handling</text>
  <text x="520" y="292" fill="#58a6ff" font-size="9" text-anchor="middle">Order Status Tracking</text>
  <text x="520" y="307" fill="#58a6ff" font-size="9" text-anchor="middle">Fulfillment</text>

  <!-- Service 4: Notification Service -->
  <rect x="650" y="220" width="140" height="100" rx="8" fill="#1f6feb" stroke="#58a6ff" stroke-width="2"/>
  <text x="720" y="245" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Notification Service</text>
  <text x="720" y="262" fill="#58a6ff" font-size="9" text-anchor="middle">Email Notifications</text>
  <text x="720" y="277" fill="#58a6ff" font-size="9" text-anchor="middle">SMS/Push</text>
  <text x="720" y="292" fill="#58a6ff" font-size="9" text-anchor="middle">Event Listeners</text>
  <text x="720" y="307" fill="#58a6ff" font-size="9" text-anchor="middle">Template Engine</text>

  <!-- Service 5: Payment Service -->
  <rect x="850" y="220" width="140" height="100" rx="8" fill="#1f6feb" stroke="#58a6ff" stroke-width="2"/>
  <text x="920" y="245" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Payment Service</text>
  <text x="920" y="262" fill="#58a6ff" font-size="9" text-anchor="middle">Payment Processing</text>
  <text x="920" y="277" fill="#58a6ff" font-size="9" text-anchor="middle">Gateway Integration</text>
  <text x="920" y="292" fill="#58a6ff" font-size="9" text-anchor="middle">Refund Management</text>
  <text x="920" y="307" fill="#58a6ff" font-size="9" text-anchor="middle">Compliance</text>

  <!-- Service 6: Analytics Service -->
  <rect x="1050" y="220" width="140" height="100" rx="8" fill="#1f6feb" stroke="#58a6ff" stroke-width="2"/>
  <text x="1120" y="245" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">Analytics Service</text>
  <text x="1120" y="262" fill="#58a6ff" font-size="9" text-anchor="middle">Event Collection</text>
  <text x="1120" y="277" fill="#58a6ff" font-size="9" text-anchor="middle">Metrics Processing</text>
  <text x="1120" y="292" fill="#58a6ff" font-size="9" text-anchor="middle">Dashboards</text>
  <text x="1120" y="307" fill="#58a6ff" font-size="9" text-anchor="middle">Reporting</text>

  <!-- Gateway to Services -->
  <line x1="350" y1="160" x2="120" y2="220" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="160" x2="320" y2="220" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="160" x2="520" y2="220" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="160" x2="720" y2="220" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="160" x2="920" y2="220" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="160" x2="1120" y2="220" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Inter-Service Communication -->
  <line x1="190" y1="270" x2="250" y2="270" stroke="#f85149" stroke-width="1.5" stroke-dasharray="3" marker-end="url(#arrowhead)"/>
  <line x1="390" y1="270" x2="450" y2="270" stroke="#f85149" stroke-width="1.5" stroke-dasharray="3" marker-end="url(#arrowhead)"/>
  <line x1="590" y1="270" x2="650" y2="270" stroke="#f85149" stroke-width="1.5" stroke-dasharray="3" marker-end="url(#arrowhead)"/>
  <line x1="790" y1="270" x2="850" y2="270" stroke="#f85149" stroke-width="1.5" stroke-dasharray="3" marker-end="url(#arrowhead)"/>
  <line x1="990" y1="270" x2="1050" y2="270" stroke="#f85149" stroke-width="1.5" stroke-dasharray="3" marker-end="url(#arrowhead)"/>

  <!-- ============ MESSAGE QUEUE / EVENT BUS ============ -->
  <rect x="250" y="380" width="850" height="70" rx="8" fill="#21262d" stroke="#8957e5" stroke-width="2"/>
  <text x="675" y="405" fill="#8957e5" font-size="12" font-weight="bold" text-anchor="middle">Message Queue / Event Bus</text>
  <text x="675" y="423" fill="#c9d1d9" font-size="10" text-anchor="middle">RabbitMQ / Apache Kafka / Azure Service Bus — Async Communication, Event-Driven Architecture, Decoupling</text>
  <text x="675" y="438" fill="#c9d1d9" font-size="10" text-anchor="middle">Dead Letter Queues • Retry Policies • Topic-based Pub/Sub • Event Sourcing</text>

  <!-- Services to Message Queue -->
  <line x1="120" y1="320" x2="350" y2="380" stroke="#8957e5" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="320" y1="320" x2="450" y2="380" stroke="#8957e5" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="520" y1="320" x2="550" y2="380" stroke="#8957e5" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="720" y1="320" x2="650" y2="380" stroke="#8957e5" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="920" y1="320" x2="850" y2="380" stroke="#8957e5" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="1120" y1="320" x2="950" y2="380" stroke="#8957e5" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ============ DATABASES (Database-per-Service) ============ -->
  <rect x="50" y="520" width="120" height="80" rx="6" fill="#238636" stroke="#7ee787" stroke-width="2"/>
  <text x="110" y="545" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">User DB</text>
  <text x="110" y="560" fill="#d0f0d0" font-size="8" text-anchor="middle">(PostgreSQL)</text>
  <text x="110" y="573" fill="#d0f0d0" font-size="8" text-anchor="middle">Own schema</text>
  <text x="110" y="585" fill="#d0f0d0" font-size="8" text-anchor="middle">Isolated</text>

  <rect x="230" y="520" width="120" height="80" rx="6" fill="#238636" stroke="#7ee787" stroke-width="2"/>
  <text x="290" y="545" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">Product DB</text>
  <text x="290" y="560" fill="#d0f0d0" font-size="8" text-anchor="middle">(MongoDB)</text>
  <text x="290" y="573" fill="#d0f0d0" font-size="8" text-anchor="middle">Own schema</text>
  <text x="290" y="585" fill="#d0f0d0" font-size="8" text-anchor="middle">Isolated</text>

  <rect x="410" y="520" width="120" height="80" rx="6" fill="#238636" stroke="#7ee787" stroke-width="2"/>
  <text x="470" y="545" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">Order DB</text>
  <text x="470" y="560" fill="#d0f0d0" font-size="8" text-anchor="middle">(PostgreSQL)</text>
  <text x="470" y="573" fill="#d0f0d0" font-size="8" text-anchor="middle">Own schema</text>
  <text x="470" y="585" fill="#d0f0d0" font-size="8" text-anchor="middle">Isolated</text>

  <rect x="590" y="520" width="120" height="80" rx="6" fill="#238636" stroke="#7ee787" stroke-width="2"/>
  <text x="650" y="545" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">Notification DB</text>
  <text x="650" y="560" fill="#d0f0d0" font-size="8" text-anchor="middle">(Redis Cache)</text>
  <text x="650" y="573" fill="#d0f0d0" font-size="8" text-anchor="middle">Session store</text>
  <text x="650" y="585" fill="#d0f0d0" font-size="8" text-anchor="middle">Logs</text>

  <rect x="770" y="520" width="120" height="80" rx="6" fill="#238636" stroke="#7ee787" stroke-width="2"/>
  <text x="830" y="545" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">Payment DB</text>
  <text x="830" y="560" fill="#d0f0d0" font-size="8" text-anchor="middle">(PostgreSQL)</text>
  <text x="830" y="573" fill="#d0f0d0" font-size="8" text-anchor="middle">Encrypted</text>
  <text x="830" y="585" fill="#d0f0d0" font-size="8" text-anchor="middle">Compliant</text>

  <rect x="950" y="520" width="120" height="80" rx="6" fill="#238636" stroke="#7ee787" stroke-width="2"/>
  <text x="1010" y="545" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">Analytics DB</text>
  <text x="1010" y="560" fill="#d0f0d0" font-size="8" text-anchor="middle">(BigQuery/Redshift)</text>
  <text x="1010" y="573" fill="#d0f0d0" font-size="8" text-anchor="middle">Read-only</text>
  <text x="1010" y="585" fill="#d0f0d0" font-size="8" text-anchor="middle">Analytics</text>

  <!-- Services to Databases -->
  <line x1="110" y1="320" x2="110" y2="520" stroke="#238636" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="320" y1="320" x2="290" y2="520" stroke="#238636" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="520" y1="320" x2="470" y2="520" stroke="#238636" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="720" y1="320" x2="650" y2="520" stroke="#238636" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="920" y1="320" x2="830" y2="520" stroke="#238636" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="1120" y1="320" x2="1010" y2="520" stroke="#238636" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- ============ CACHING LAYER ============ -->
  <rect x="1130" y="520" width="140" height="80" rx="6" fill="#d29922" stroke="#f0883e" stroke-width="2"/>
  <text x="1200" y="545" fill="#332" font-size="10" font-weight="bold" text-anchor="middle">Distributed Cache</text>
  <text x="1200" y="560" fill="#332" font-size="8" text-anchor="middle">(Redis/Memcached)</text>
  <text x="1200" y="573" fill="#332" font-size="8" text-anchor="middle">Reduces DB load</text>
  <text x="1200" y="585" fill="#332" font-size="8" text-anchor="middle">Session mgmt</text>

  <!-- Services to Cache -->
  <line x1="120" y1="320" x2="1150" y2="520" stroke="#d29922" stroke-width="1.5" stroke-dasharray="3" marker-end="url(#arrowhead)"/>
  <line x1="320" y1="320" x2="1180" y2="520" stroke="#d29922" stroke-width="1.5" stroke-dasharray="3" marker-end="url(#arrowhead)"/>
  <line x1="520" y1="320" x2="1200" y2="520" stroke="#d29922" stroke-width="1.5" stroke-dasharray="3" marker-end="url(#arrowhead)"/>

  <!-- ============ SECURITY LAYER ============ -->
  <rect x="50" y="680" width="310" height="120" rx="8" fill="#21262d" stroke="#f85149" stroke-width="2"/>
  <text x="205" y="705" fill="#f85149" font-size="12" font-weight="bold" text-anchor="middle">Security & Authentication</text>
  <text x="70" y="725" fill="#c9d1d9" font-size="9">• OAuth 2.0 / OpenID Connect (Identity Server)</text>
  <text x="70" y="742" fill="#c9d1d9" font-size="9">• JWT Tokens (stateless, time-limited)</text>
  <text x="70" y="759" fill="#c9d1d9" font-size="9">• API Key Management &amp; Rate Limiting</text>
  <text x="70" y="776" fill="#c9d1d9" font-size="9">• mTLS between services (Zero Trust)</text>
  <text x="70" y="793" fill="#c9d1d9" font-size="9">• Role-Based Access Control (RBAC)</text>

  <!-- ============ RESILIENCY PATTERNS ============ -->
  <rect x="420" y="680" width="310" height="120" rx="8" fill="#21262d" stroke="#7ee787" stroke-width="2"/>
  <text x="575" y="705" fill="#7ee787" font-size="12" font-weight="bold" text-anchor="middle">Resiliency &amp; Fault Tolerance</text>
  <text x="440" y="725" fill="#c9d1d9" font-size="9">• Circuit Breaker Pattern (Istio/Hystrix)</text>
  <text x="440" y="742" fill="#c9d1d9" font-size="9">• Retry Logic &amp; Exponential Backoff</text>
  <text x="440" y="759" fill="#c9d1d9" font-size="9">• Timeout Policies &amp; Fallback Handlers</text>
  <text x="440" y="776" fill="#c9d1d9" font-size="9">• Bulkhead Pattern (thread pools isolation)</text>
  <text x="440" y="793" fill="#c9d1d9" font-size="9">• Self-healing &amp; Auto-restart</text>

  <!-- ============ OBSERVABILITY ============ -->
  <rect x="790" y="680" width="310" height="120" rx="8" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
  <text x="945" y="705" fill="#58a6ff" font-size="12" font-weight="bold" text-anchor="middle">Observability &amp; Monitoring</text>
  <text x="810" y="725" fill="#c9d1d9" font-size="9">• Distributed Tracing (Jaeger/Zipkin)</text>
  <text x="810" y="742" fill="#c9d1d9" font-size="9">• Centralized Logging (ELK/Loki)</text>
  <text x="810" y="759" fill="#c9d1d9" font-size="9">• Metrics &amp; Monitoring (Prometheus/Grafana)</text>
  <text x="810" y="776" fill="#c9d1d9" font-size="9">• APM (Application Performance Monitoring)</text>
  <text x="810" y="793" fill="#c9d1d9" font-size="9">• Health Checks &amp; Alerting (PagerDuty)</text>

  <!-- ============ CONTAINER ORCHESTRATION ============ -->
  <rect x="1160" y="680" width="190" height="120" rx="8" fill="#21262d" stroke="#8957e5" stroke-width="2"/>
  <text x="1255" y="705" fill="#8957e5" font-size="12" font-weight="bold" text-anchor="middle">Orchestration</text>
  <text x="1180" y="725" fill="#c9d1d9" font-size="9">• Kubernetes (K8s)</text>
  <text x="1180" y="742" fill="#c9d1d9" font-size="9">• Service Mesh (Istio)</text>
  <text x="1180" y="759" fill="#c9d1d9" font-size="9">• Auto-scaling</text>
  <text x="1180" y="776" fill="#c9d1d9" font-size="9">• Load Distribution</text>
  <text x="1180" y="793" fill="#c9d1d9" font-size="9">• Rolling Updates</text>

  <!-- Legend -->
  <text x="50" y="860" fill="#8b949e" font-size="10">─ Solid arrows: Direct sync calls  │  ─ ─ Dashed arrows: Async/Event-driven calls</text>
  
  <!-- Key Benefits Box -->
  <rect x="50" y="880" width="1280" height="50" rx="6" fill="#21262d" stroke="#7ee787" stroke-width="1"/>
  <text x="60" y="900" fill="#7ee787" font-size="10" font-weight="bold">✓ Benefits:</text>
  <text x="180" y="900" fill="#c9d1d9" font-size="9">Independent Scaling • Technology Diversity • Fault Isolation • Rapid Deployment • Team Autonomy • High Availability • Resilient to Failures</text>
</svg>