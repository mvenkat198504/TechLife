<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500"><rect width="1800" height="1500" fill="#f5f8fc"/><text x="900" y="55" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="42" fill="#15243b">ORDER PROCESSING • AZURE MICROSERVICES</text><text x="900" y="110" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#15243b">Reference design | Transactional outbox + orchestrated saga</text><rect x="90" y="175" width="380" height="125" rx="18" fill="white" stroke="#2563eb" stroke-width="3"/><text x="280.0" y="207" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#2563eb">1  Web / Mobile Client</text><text x="280.0" y="242" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Angular / React / mobile app</text><text x="280.0" y="271" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">HTTPS + OAuth 2.0 / OIDC</text><rect x="650" y="175" width="450" height="125" rx="18" fill="white" stroke="#2563eb" stroke-width="3"/><text x="875.0" y="207" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#2563eb">2  Azure API Management</text><text x="875.0" y="242" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">JWT validation • rate limiting</text><text x="875.0" y="271" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Route POST /orders to Order API</text><polyline points="470,235 650,235" fill="none" stroke="#2563eb" stroke-width="4"/><polygon points="650,235 635.5928463623571,241.95944854577968 635.5928463623571,228.04055145422032" fill="#2563eb"/><text x="560" y="210" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#2563eb">HTTPS</text><rect x="1280" y="175" width="420" height="125" rx="18" fill="white" stroke="#2563eb" stroke-width="3"/><text x="1490.0" y="207" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#2563eb">Identity &amp; secrets</text><text x="1490.0" y="242" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Microsoft Entra ID</text><text x="1490.0" y="271" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Managed Identity + Key Vault</text><rect x="650" y="365" width="450" height="130" rx="18" fill="white" stroke="#2563eb" stroke-width="3"/><text x="875.0" y="397" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#2563eb">3  Order Service</text><text x="875.0" y="432" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">ASP.NET Core + EF Core</text><text x="875.0" y="461" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Save order with status Pending</text><polyline points="875,300 875,365" fill="none" stroke="#2563eb" stroke-width="4"/><polygon points="875,365 868.0405514542203,350.5928463623572 881.9594485457797,350.5928463623572" fill="#2563eb"/><rect x="90" y="550" width="540" height="155" rx="18" fill="white" stroke="#2563eb" stroke-width="3"/><text x="360.0" y="582" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#2563eb">4  Order database • Azure SQL</text><text x="360.0" y="617" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Orders + Outbox tables</text><text x="360.0" y="646" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">ONE local ACID transaction</text><text x="360.0" y="675" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Commit both records together</text><polyline points="650,430 360,430 360,550" fill="none" stroke="#2563eb" stroke-width="4"/><polygon points="360,550 353.0405514542203,535.5928463623571 366.9594485457797,535.5928463623571" fill="#2563eb"/><text x="470" y="405" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#2563eb">Save order + OrderCreated event</text><rect x="750" y="550" width="450" height="155" rx="18" fill="white" stroke="#2563eb" stroke-width="3"/><text x="975.0" y="582" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#2563eb">5  Outbox Publisher</text><text x="975.0" y="617" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">.NET BackgroundService</text><text x="975.0" y="646" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Read committed outbox events</text><text x="975.0" y="675" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Publish, then mark as sent</text><polyline points="630,625 750,625" fill="none" stroke="#2563eb" stroke-width="4"/><polygon points="750,625 735.5928463623571,631.9594485457797 735.5928463623571,618.0405514542203" fill="#2563eb"/><rect x="1330" y="550" width="380" height="155" rx="18" fill="white" stroke="#2563eb" stroke-width="3"/><text x="1520.0" y="582" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#2563eb">6  Azure Service Bus</text><text x="1520.0" y="617" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Queues / topics</text><text x="1520.0" y="646" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Commands + result events</text><text x="1520.0" y="675" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Retries + dead-letter queues</text><polyline points="1200,625 1330,625" fill="none" stroke="#2563eb" stroke-width="4"/><polygon points="1330,625 1315.5928463623572,631.9594485457797 1315.5928463623572,618.0405514542203" fill="#2563eb"/><rect x="730" y="800" width="540" height="160" rx="18" fill="white" stroke="#2563eb" stroke-width="3"/><text x="1000.0" y="832" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#2563eb">7  Saga Orchestrator</text><text x="1000.0" y="867" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">ASP.NET Core worker + MassTransit</text><text x="1000.0" y="896" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Persist saga state in Azure SQL</text><text x="1000.0" y="925" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Reserve stock → Pay → Create shipment</text><polyline points="1510,705 1510,765 1000,765 1000,800" fill="none" stroke="#2563eb" stroke-width="4"/><polygon points="1000,800 993.0405514542203,785.5928463623571 1006.9594485457797,785.5928463623571" fill="#2563eb"/><text x="1320" y="740" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#2563eb">OrderCreated</text><rect x="80" y="1060" width="440" height="145" rx="18" fill="white" stroke="#2563eb" stroke-width="3"/><text x="300.0" y="1092" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#2563eb">8a  Inventory Service</text><text x="300.0" y="1127" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">ASP.NET Core + EF Core</text><text x="300.0" y="1156" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Reserve / release stock</text><text x="300.0" y="1185" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Own Inventory DB • Azure SQL</text><rect x="680" y="1060" width="440" height="145" rx="18" fill="white" stroke="#2563eb" stroke-width="3"/><text x="900.0" y="1092" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#2563eb">8b  Payment Service</text><text x="900.0" y="1127" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">ASP.NET Core + payment provider</text><text x="900.0" y="1156" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Charge / refund or void</text><text x="900.0" y="1185" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Own Payment DB • Azure SQL</text><rect x="1280" y="1060" width="440" height="145" rx="18" fill="white" stroke="#2563eb" stroke-width="3"/><text x="1500.0" y="1092" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#2563eb">8c  Shipping Service</text><text x="1500.0" y="1127" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">ASP.NET Core + carrier API</text><text x="1500.0" y="1156" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#1