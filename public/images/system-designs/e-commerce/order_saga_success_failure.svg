<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500"><rect width="1800" height="1500" fill="#f5f8fc"/><text x="900" y="55" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="42" fill="#15243b">ORDER SAGA • SUCCESS AND FAILURE</text><text x="900" y="110" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#15243b">Business flow | Orchestrator sends commands and receives replies through Azure Service Bus</text><rect x="550" y="180" width="700" height="110" rx="18" fill="white" stroke="#2563eb" stroke-width="3"/><text x="900.0" y="212" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#2563eb">Order accepted</text><text x="900.0" y="247" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Save Pending order + outbox event atomically</text><polyline points="900,290 900,345" fill="none" stroke="#2563eb" stroke-width="4"/><polygon points="900,345 893.0405514542203,330.5928463623572 906.9594485457797,330.5928463623572" fill="#2563eb"/><rect x="550" y="345" width="700" height="110" rx="18" fill="white" stroke="#2563eb" stroke-width="3"/><text x="900.0" y="377" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#2563eb">1  Reserve inventory</text><text x="900.0" y="412" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Inventory Service → Inventory DB</text><polyline points="900,455 900,530" fill="none" stroke="#2563eb" stroke-width="4"/><polygon points="900,530 893.0405514542203,515.5928463623571 906.9594485457797,515.5928463623571" fill="#2563eb"/><text x="1010" y="490" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#2563eb">Stock reserved</text><rect x="550" y="530" width="700" height="110" rx="18" fill="white" stroke="#2563eb" stroke-width="3"/><text x="900.0" y="562" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#2563eb">2  Process payment</text><text x="900.0" y="597" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Payment Service → provider + Payment DB</text><polyline points="900,640 900,715" fill="none" stroke="#2563eb" stroke-width="4"/><polygon points="900,715 893.0405514542203,700.5928463623571 906.9594485457797,700.5928463623571" fill="#2563eb"/><text x="1010" y="677" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#2563eb">Payment succeeded</text><rect x="550" y="715" width="700" height="110" rx="18" fill="white" stroke="#2563eb" stroke-width="3"/><text x="900.0" y="747" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#2563eb">3  Create shipment</text><text x="900.0" y="782" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Shipping Service → carrier + Shipping DB</text><polyline points="900,825 900,900" fill="none" stroke="#2563eb" stroke-width="4"/><polygon points="900,900 893.0405514542203,885.5928463623571 906.9594485457797,885.5928463623571" fill="#2563eb"/><text x="1030" y="861" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#2563eb">Shipment created</text><rect x="550" y="900" width="700" height="110" rx="18" fill="white" stroke="#15803d" stroke-width="3"/><text x="900.0" y="932" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#15803d">4  Complete order</text><text x="900.0" y="967" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Order Service sets Completed; client reads status</text><rect x="40" y="345" width="390" height="110" rx="18" fill="white" stroke="#dc2626" stroke-width="3"/><text x="235.0" y="377" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#dc2626">Inventory failed</text><text x="235.0" y="412" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Cancel order • no charge</text><polyline points="550,400 430,400" fill="none" stroke="#dc2626" stroke-width="4"/><polygon points="430,400 444.4071536376428,393.0405514542203 444.4071536376428,406.9594485457797" fill="#dc2626"/><rect x="40" y="530" width="390" height="140" rx="18" fill="white" stroke="#dc2626" stroke-width="3"/><text x="235.0" y="562" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#dc2626">Payment failed</text><text x="235.0" y="597" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Release reserved inventory</text><text x="235.0" y="626" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Then cancel order</text><polyline points="550,585 430,585" fill="none" stroke="#dc2626" stroke-width="4"/><polygon points="430,585 444.4071536376428,578.0405514542203 444.4071536376428,591.9594485457797" fill="#dc2626"/><rect x="1360" y="715" width="400" height="170" rx="18" fill="white" stroke="#dc2626" stroke-width="3"/><text x="1560.0" y="747" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#dc2626">Shipment failed</text><text x="1560.0" y="782" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Refund / void payment</text><text x="1560.0" y="811" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Release reserved inventory</text><text x="1560.0" y="840" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Then cancel order</text><polyline points="1250,770 1360,770" fill="none" stroke="#dc2626" stroke-width="4"/><polygon points="1360,770 1345.5928463623572,776.9594485457797 1345.5928463623572,763.0405514542203" fill="#dc2626"/><rect x="200" y="1100" width="1400" height="155" rx="18" fill="white" stroke="#dc2626" stroke-width="3"/><text x="900.0" y="1132" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#dc2626">Failure handling is a workflow, not a database rollback</text><text x="900.0" y="1167" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Retry transient errors first. Use timeouts, correlation IDs and idempotent handlers.</text><text x="900.0" y="1196" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Persist each saga step and compensation result. Retry failed compensation.</text><text x="900.0" y="1225" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Send exhausted failures to dead-letter queues; alert for manual recovery.</text><rect x="200" y="1310" width="1400" height="110" rx="18" fill="white" stroke="#2563eb" stroke-width="3"/><text x="900.0" y="1342" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#2563eb">Reliable status for the user</text><text x="900.0" y="1377" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">POST /orders → 202 Accepted + order ID  •  GET /orders/{id} → current status</text></svg>