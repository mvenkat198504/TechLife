<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500"><rect width="1800" height="1500" fill="#f5f8fc"/><text x="900" y="55" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="42" fill="#15243b">BACKGROUND JOB PROCESSING SYSTEM</text><text x="900" y="110" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#15243b">ASP.NET Core + Azure | Reliable submission, scalable workers, retries and job tracking</text><rect x="70" y="180" width="370" height="125" rx="18" fill="white" stroke="#2563eb" stroke-width="3"/><text x="255.0" y="212" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#2563eb">1  Client application</text><text x="255.0" y="247" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Angular / React</text><text x="255.0" y="276" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Submit job • view progress</text><rect x="650" y="180" width="490" height="125" rx="18" fill="white" stroke="#2563eb" stroke-width="3"/><text x="895.0" y="212" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#2563eb">2  Job API • ASP.NET Core</text><text x="895.0" y="247" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Azure API Management + JWT</text><text x="895.0" y="276" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Validate request + idempotency key</text><polyline points="440,240 650,240" fill="none" stroke="#2563eb" stroke-width="4"/><polygon points="650,240 635.5928463623571,246.95944854577968 635.5928463623571,233.04055145422032" fill="#2563eb"/><text x="545" y="210" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#2563eb">POST /jobs</text><rect x="1310" y="180" width="420" height="125" rx="18" fill="white" stroke="#2563eb" stroke-width="3"/><text x="1520.0" y="212" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#2563eb">Scheduled jobs</text><text x="1520.0" y="247" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Azure Functions Timer trigger</text><text x="1520.0" y="276" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Submit due jobs to Job API</text><polyline points="1310,240 1140,240" fill="none" stroke="#2563eb" stroke-width="4"/><polygon points="1140,240 1154.4071536376428,233.04055145422032 1154.4071536376428,246.95944854577968" fill="#2563eb"/><text x="900" y="335" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#15803d">Return 202 Accepted + JobId after the database commit</text><rect x="120" y="405" width="520" height="150" rx="18" fill="white" stroke="#2563eb" stroke-width="3"/><text x="380.0" y="437" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#2563eb">3  Job store • Azure SQL</text><text x="380.0" y="472" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">EF Core: Jobs + Outbox tables</text><text x="380.0" y="501" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Save Queued job + event atomically</text><text x="380.0" y="530" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">JobId • status • attempts • progress</text><polyline points="650,270 580,270 580,375 380,375 380,405" fill="none" stroke="#2563eb" stroke-width="4"/><polygon points="380,405 373.0405514542203,390.5928463623572 386.9594485457797,390.5928463623572" fill="#2563eb"/><rect x="760" y="405" width="430" height="150" rx="18" fill="white" stroke="#2563eb" stroke-width="3"/><text x="975.0" y="437" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#2563eb">4  Outbox Publisher</text><text x="975.0" y="472" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">.NET BackgroundService</text><text x="975.0" y="501" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Publish committed job events</text><text x="975.0" y="530" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Mark sent after broker accepts</text><polyline points="640,480 760,480" fill="none" stroke="#2563eb" stroke-width="4"/><polygon points="760,480 745.5928463623571,486.9594485457797 745.5928463623571,473.0405514542203" fill="#2563eb"/><rect x="1320" y="405" width="410" height="150" rx="18" fill="white" stroke="#2563eb" stroke-width="3"/><text x="1525.0" y="437" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#2563eb">5  Azure Service Bus</text><text x="1525.0" y="472" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Durable work queue</text><text x="1525.0" y="501" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Message: JobId + payload reference</text><text x="1525.0" y="530" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">At-least-once delivery</text><polyline points="1190,480 1320,480" fill="none" stroke="#2563eb" stroke-width="4"/><polygon points="1320,480 1305.5928463623572,486.9594485457797 1305.5928463623572,473.0405514542203" fill="#2563eb"/><rect x="510" y="670" width="780" height="190" rx="18" fill="white" stroke="#2563eb" stroke-width="3"/><text x="900.0" y="702" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#2563eb">6  Worker pool • .NET Worker Service</text><text x="900.0" y="737" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Azure Container Apps + queue-based autoscaling</text><text x="900.0" y="766" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Competing consumers: worker A / worker B / worker C</text><text x="900.0" y="795" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">PeekLock → claim job → execute handler → save result → Complete</text><text x="900.0" y="824" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Renew locks for long jobs; bounded concurrency + cancellation</text><polyline points="1515,555 1515,620 900,620 900,670" fill="none" stroke="#2563eb" stroke-width="4"/><polygon points="900,670 893.0405514542203,655.5928463623571 906.9594485457797,655.5928463623571" fill="#2563eb"/><text x="1240" y="590" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#2563eb">Receive available work</text><rect x="60" y="670" width="360" height="190" rx="18" fill="white" stroke="#2563eb" stroke-width="3"/><text x="240.0" y="702" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#2563eb">Job status tracking</text><text x="240.0" y="737" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Queued → Running</text><text x="240.0" y="766" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Succeeded / Failed</text><text x="240.0" y="795" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Workers update Azure SQL</text><text x="240.0" y="824" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">API reads status by JobId</text><polyline points="510,765 420,765" fill="none" stroke="#15803d" stroke-width="4"/><polygon points="420,765 434.4071536376428,758.0405514542203 434.4071536376428,771.9594485457797" fill="#15803d"/><rect x="1390" y="670" width="350" height="190" rx="18" fill="white" stroke="#2563eb" stroke-width="3"/><text x="1565.0" y="702" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#2563eb">Files &amp; external work</text><text x="1565.0" y="737" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Azure Blob Storage</text><text x="1565.0" y="766" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Reports / input / output</text><text x="1565.0" y="795" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Email / third-party APIs</text><text x="1565.0" y="824" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Idempotent side effects</text><polyline points="1290,765 1390,765" fill="none" stroke="#2563eb" stroke-width="4"/><polygon points="1390,765 1375.5928463623572,771.9594485457797 1375.5928463623572,758.0405514542203" fill="#2563eb"/><rect x="90" y="980" width="480" height="155" rx="18" fill="white" stroke="#15803d" stroke-width="3"/><text x="330.0" y="1012" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#15803d">7a  Success</text><text x="330.0" y="1047" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Persist result + Succeeded status</text><text x="330.0" y="1076" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Then acknowledge the queue message</text><text x="330.0" y="1105" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Client polls GET /jobs/{id}</text><polyline points="690,860 690,915 330,915 330,980" fill="none" stroke="#15803d" stroke-width="4"/><polygon points="330,980 323.0405514542203,965.5928463623571 336.9594485457797,965.5928463623571" fill="#15803d"/><rect x="660" y="980" width="480" height="155" rx="18" fill="white" stroke="#2563eb" stroke-width="3"/><text x="900.0" y="1012" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#2563eb">7b  Transient failure</text><text x="900.0" y="1047" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Retry with backoff + jitter</text><text x="900.0" y="1076" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Track attempts; cap retry budget</text><text x="900.0" y="1105" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Use delayed retry / scheduled message</text><polyline points="900,860 900,980" fill="none" stroke="#2563eb" stroke-width="4"/><polygon points="900,980 893.0405514542203,965.5928463623571 906.9594485457797,965.5928463623571" fill="#2563eb"/><rect x="1230" y="980" width="480" height="155" rx="18" fill="white" stroke="#dc2626" stroke-width="3"/><text x="1470.0" y="1012" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#dc2626">7c  Permanent / exhausted</text><text x="1470.0" y="1047" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Move message to dead-letter queue</text><text x="1470.0" y="1076" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Persist Failed status + error details</text><text x="1470.0" y="1105" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Alert operator; fix and replay safely</text><polyline points="1110,860 1110,915 1470,915 1470,980" fill="none" stroke="#dc2626" stroke-width="4"/><polygon points="1470,980 1463.0405514542203,965.5928463623571 1476.9594485457797,965.5928463623571" fill="#dc2626"/><text x="900" y="1180" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#15243b">Duplicate deliveries are expected: use durable JobId deduplication, atomic claims and idempotent handlers.</text><rect x="90" y="1250" width="1620" height="180" rx="18" fill="white" stroke="#15803d" stroke-width="3"/><text x="900.0" y="1282" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#15803d">Shared platform &amp; operational controls</text><text x="900.0" y="1317" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Security: Microsoft Entra ID + Managed Identity + Azure Key Vault</text><text x="900.0" y="1346" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Monitoring: Azure Monitor + Application Insights + OpenTelemetry; correlate request, JobId and message</text><text x="900.0" y="1375" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Delivery: Azure DevOps / GitHub Actions + Docker; deploy API and worker independently</text><text x="900.0" y="1404" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#15243b">Alert on queue age, failure rate, retry count and DLQ depth. Large payloads stay in Blob Storage.</text></svg>