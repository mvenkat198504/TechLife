<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="820" fill="#0d1117"/>
  <text x="600" y="35" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle">Large-Scale File/Document Storage System — Azure Blob Storage</text>

  <!-- Clients -->
  <rect x="30" y="70" width="160" height="60" rx="8" fill="#1f6feb"/>
  <text x="110" y="105" fill="#fff" font-size="13" text-anchor="middle">Web / Mobile Clients</text>

  <!-- CDN -->
  <rect x="250" y="70" width="180" height="60" rx="8" fill="#238636"/>
  <text x="340" y="95" fill="#fff" font-size="13" text-anchor="middle">Azure Front Door / CDN</text>
  <text x="340" y="112" fill="#d0f0d0" font-size="10" text-anchor="middle">(Cache + WAF + TLS)</text>

  <!-- API Gateway -->
  <rect x="490" y="70" width="180" height="60" rx="8" fill="#8957e5"/>
  <text x="580" y="95" fill="#fff" font-size="13" text-anchor="middle">API Gateway / App Service</text>
  <text x="580" y="112" fill="#eee" font-size="10" text-anchor="middle">(APIM + Azure AD Auth)</text>

  <!-- Arrows -->
  <line x1="190" y1="100" x2="250" y2="100" stroke="#8b949e" stroke-width="2"/>
  <line x1="430" y1="100" x2="490" y2="100" stroke="#8b949e" stroke-width="2"/>

  <!-- Upload Service -->
  <rect x="490" y="180" width="180" height="70" rx="8" fill="#d29922"/>
  <text x="580" y="205" fill="#fff" font-size="13" text-anchor="middle">Upload Service</text>
  <text x="580" y="222" fill="#332" font-size="10" text-anchor="middle">SAS Token Generator</text>
  <text x="580" y="238" fill="#332" font-size="10" text-anchor="middle">Chunked/Resumable Upload</text>
  <line x1="580" y1="130" x2="580" y2="180" stroke="#8b949e" stroke-width="2"/>

  <!-- Metadata Service -->
  <rect x="730" y="180" width="180" height="70" rx="8" fill="#d29922"/>
  <text x="820" y="205" fill="#fff" font-size="13" text-anchor="middle">Metadata Service</text>
  <text x="820" y="222" fill="#332" font-size="10" text-anchor="middle">File info, tags, versions</text>
  <text x="820" y="238" fill="#332" font-size="10" text-anchor="middle">Access control lists</text>
  <line x1="670" y1="215" x2="730" y2="215" stroke="#8b949e" stroke-width="2"/>

  <!-- Azure Blob Storage -->
  <rect x="450" y="300" width="300" height="90" rx="8" fill="#1f6feb"/>
  <text x="600" y="330" fill="#fff" font-size="15" font-weight="bold" text-anchor="middle">Azure Blob Storage</text>
  <text x="600" y="350" fill="#dce" font-size="11" text-anchor="middle">Hot / Cool / Archive Tiers</text>
  <text x="600" y="367" fill="#dce" font-size="11" text-anchor="middle">Block Blobs + Lifecycle Policies</text>
  <line x1="580" y1="250" x2="600" y2="300" stroke="#8b949e" stroke-width="2"/>

  <!-- Metadata DB -->
  <rect x="900" y="300" width="220" height="90" rx="8" fill="#238636"/>
  <text x="1010" y="330" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">Azure Cosmos DB</text>
  <text x="1010" y="350" fill="#dfd" font-size="11" text-anchor="middle">File metadata store</text>
  <text x="1010" y="367" fill="#dfd" font-size="11" text-anchor="middle">(NoSQL, globally distributed)</text>
  <line x1="820" y1="250" x2="1010" y2="300" stroke="#8b949e" stroke-width="2"/>

  <!-- Search Index -->
  <rect x="900" y="420" width="220" height="70" rx="8" fill="#8957e5"/>
  <text x="1010" y="445" fill="#fff" font-size="13" text-anchor="middle">Azure Cognitive Search</text>
  <text x="1010" y="462" fill="#eee" font-size="10" text-anchor="middle">Full-text metadata search</text>
  <line x1="1010" y1="390" x2="1010" y2="420" stroke="#8b949e" stroke-width="2"/>

  <!-- Event Grid + Functions -->
  <rect x="450" y="430" width="300" height="90" rx="8" fill="#d29922"/>
  <text x="600" y="455" fill="#332" font-size="13" font-weight="bold" text-anchor="middle">Azure Event Grid + Functions</text>
  <text x="600" y="472" fill="#332" font-size="10" text-anchor="middle">Virus scan, thumbnail gen,</text>
  <text x="600" y="487" fill="#332" font-size="10" text-anchor="middle">transcoding, tier transitions</text>
  <line x1="600" y1="390" x2="600" y2="430" stroke="#8b949e" stroke-width="2"/>

  <!-- Security -->
  <rect x="30" y="300" width="380" height="220" rx="8" fill="#21262d" stroke="#f85149" stroke-width="1.5"/>
  <text x="220" y="325" fill="#f85149" font-size="14" font-weight="bold" text-anchor="middle">Security Layer</text>
  <text x="55" y="350" fill="#c9d1d9" font-size="11">• Azure AD (OAuth2 / OIDC) for identity</text>
  <text x="55" y="370" fill="#c9d1d9" font-size="11">• SAS tokens (time-limited, scoped) for blob access</text>
  <text x="55" y="390" fill="#c9d1d9" font-size="11">• RBAC + Azure Private Endpoints</text>
  <text x="55" y="410" fill="#c9d1d9" font-size="11">• Encryption at rest (Storage Service Encryption)</text>
  <text x="55" y="430" fill="#c9d1d9" font-size="11">• Encryption in transit (TLS 1.2+)</text>
  <text x="55" y="450" fill="#c9d1d9" font-size="11">• Customer-managed keys (Azure Key Vault)</text>
  <text x="55" y="470" fill="#c9d1d9" font-size="11">• Defender for Storage (malware/anomaly detection)</text>
  <text x="55" y="490" fill="#c9d1d9" font-size="11">• Immutable/WORM policies for compliance</text>

  <!-- Monitoring -->
  <rect x="30" y="560" width="380" height="120" rx="8" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="220" y="585" fill="#58a6ff" font-size="14" font-weight="bold" text-anchor="middle">Observability</text>
  <text x="55" y="610" fill="#c9d1d9" font-size="11">• Azure Monitor + Log Analytics</text>
  <text x="55" y="630" fill="#c9d1d9" font-size="11">• Application Insights (tracing)</text>
  <text x="55" y="650" fill="#c9d1d9" font-size="11">• Storage Analytics logs / metrics</text>
  <text x="55" y="670" fill="#c9d1d9" font-size="11">• Alerts on capacity, throttling, errors</text>

  <!-- Data flow legend -->
  <rect x="450" y="560" width="670" height="120" rx="8" fill="#21262d" stroke="#8957e5" stroke-width="1.5"/>
  <text x="785" y="585" fill="#8957e5" font-size="14" font-weight="bold" text-anchor="middle">Upload Flow</text>
  <text x="470" y="610" fill="#c9d1d9" font-size="11">1. Client requests upload → API issues SAS token (write-only, short TTL)</text>
  <text x="470" y="630" fill="#c9d1d9" font-size="11">2. Client uploads directly to Blob Storage (chunked, parallel, resumable) — bypasses app servers</text>
  <text x="470" y="650" fill="#c9d1d9" font-size="11">3. Blob-created event → Event Grid → Function writes metadata to Cosmos DB, scans for viruses, indexes in Search</text>
  <text x="470" y="670" fill="#c9d1d9" font-size="11">4. Download served via CDN edge cache; cache-miss falls back to Blob Storage with read SAS</text>

  <!-- CDN connection -->
  <line x1="340" y1="130" x2="600" y2="300" stroke="#238636" stroke-width="2" stroke-dasharray="4"/>
  <text x="420" y="220" fill="#7ee787" font-size="10">Cache-miss origin pull</text>
</svg>